name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HR_AI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja
        run: pip install -e .[dev]
      - name: Testy
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowa obrazu
        run: docker build -t app:ci .
      - name: Start kontenera i healthcheck
        run: |
          docker run -d --name app -e HR_AI_OFFLINE=1 app:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs app
          exit 1
