name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (3D reconstruction core)
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Skaner3D-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Skaner 3D – APK ($GITHUB_REF_NAME)" \
            --notes "Automatyczna kompilacja z commita $GITHUB_SHA. Pobierz plik .apk na telefonie i zainstaluj."
