spring:
  application:
    name: radar-pracy
  datasource:
    url: ${RADAR_DB_URL:jdbc:h2:file:./data/radarpracy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${RADAR_DB_USER:sa}
    password: ${RADAR_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

radar:
  # Strefa, w której interpretowane są terminy rozmów (eksport .ics).
  calendar:
    zone: ${RADAR_CALENDAR_ZONE:Europe/Warsaw}
  demo-data: ${RADAR_DEMO_DATA:true}
  ai:
    # Bez ANTHROPIC_API_KEY (lub z RADAR_AI_OFFLINE=true) każda funkcja AI używa ścieżki offline.
    offline: ${RADAR_AI_OFFLINE:false}
    model: ${RADAR_AI_MODEL:claude-opus-5-5}
    max-tokens: 8000
  aggregator:
    # Cykliczne pobieranie ofert ze źródeł (RSS/Atom, strony kariery itp.).
    scheduler-enabled: ${RADAR_AGGREGATOR_SCHEDULER:true}
    interval-minutes: ${RADAR_AGGREGATOR_INTERVAL:60}
    user-agent: "RadarPracy/0.2 (osobisty agregator ofert pracy)"
    request-timeout-seconds: 15
    per-host-delay-ms: 1500
    max-items-per-fetch: 200
    # Oferty z datą ważności w przeszłości są archiwizowane; bez daty — po tylu dniach od pobrania.
    archive-after-days: 45
  salary:
    # Kursy do przeliczania widełek w walutach obcych (PLN za 1 jednostkę). Zaktualizuj według potrzeb.
    fx:
      EUR: 4.25
      USD: 3.90
      GBP: 4.95
      CHF: 4.55
    hours-per-month: 168
    days-per-month: 21
    # Przybliżony przelicznik B2B (netto + VAT) → równoważnik UoP brutto: B2B / 1.25.
    b2b-to-uop-factor: 1.25
    # Przybliżony przelicznik UoP netto → UoP brutto (netto ≈ 71% brutto przy średnich zarobkach).
    net-to-gross-factor: 1.40
