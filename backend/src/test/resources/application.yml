spring:
  datasource:
    url: jdbc:h2:mem:radar-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

radar:
  # Strefa, w której interpretowane są terminy rozmów (eksport .ics).
  calendar:
    zone: ${RADAR_CALENDAR_ZONE:Europe/Warsaw}
  demo-data: true
  ai:
    offline: true
    model: claude-opus-5-5
    max-tokens: 2000
  aggregator:
    scheduler-enabled: false
    interval-minutes: 60
    user-agent: "RadarPracy-test"
    request-timeout-seconds: 5
    per-host-delay-ms: 0
    max-items-per-fetch: 200
    archive-after-days: 45
  salary:
    fx:
      EUR: 4.25
      USD: 3.90
      GBP: 4.95
      CHF: 4.55
    hours-per-month: 168
    days-per-month: 21
    b2b-to-uop-factor: 1.25
    net-to-gross-factor: 1.40
