[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symulator"
version = "0.1.0"
description = "Trener rozmów rekrutacyjnych dla menedżerów: kandydat grany przez AI i coach wykrywający niedozwolone pytania"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symulator = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
