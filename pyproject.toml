[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preselekcja"
version = "0.1.0"
description = "Preselekcja CV z nadzorem człowieka, anonimizacją i audytem stronniczości (AI Act: system wysokiego ryzyka)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "anthropic>=0.70",
    # tekst z PDF
    "pypdf>=4.0",
    # obsługa uploadu plików (multipart/form-data) w FastAPI
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
preselekcja = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
