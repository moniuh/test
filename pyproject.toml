[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szkolenia"
version = "0.1.0"
description = "LMS lite szkoleń obowiązkowych (BHP, RODO, sygnaliści, antymobbing) z generatorem testów AI i raportem pod kontrolę"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
szkolenia = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
